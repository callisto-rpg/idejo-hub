#
# Production bundle for the Hub itself (HN-08): Hub app + PostgreSQL + Caddy, plus the Docker
# access chain (HN-04): Hub → docker-guard → socket-proxy → Docker socket.
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# PostgreSQL is the server the forums will share (one database and one login role each,
# HN-05). The Hub connects as `idejo_hub`, a role with CREATEDB and CREATEROLE and never
# superuser (postgres-init/01-hub-role.sh).
#
# Docker access (HN-04, steward decision 2026-11-03, docs/proposals/hn-04-docker-access.md):
# only socket-proxy mounts the Docker socket. It has no network at all and answers on a Unix
# socket that only docker-guard mounts. docker-guard checks every request body and is reachable
# only from the Hub, on the internal `docker` network. The Hub never sees the socket.
# Forum containers join the `idejo-forums` network with PostgreSQL, Caddy and the Hub.
#
# Caddy (HN-02): the Hub's host, and every forum subdomain with on-demand TLS (deploy/Caddyfile).
#
# Not here yet: the install script (HN-08).

name: idejo-hub

services:
  hub:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Run pending migrations, then start the server (both scripts come from phx.gen.release).
    command: ["sh", "-c", "/app/bin/migrate && /app/bin/server"]
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${IDEJO_HUB_DOMAIN}
      PORT: "4000"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      HUB_SECRETS_KEY: ${HUB_SECRETS_KEY}
      DATABASE_URL: ecto://idejo_hub:${HUB_DB_PASSWORD}@db/idejo_hub
      POOL_SIZE: ${POOL_SIZE:-}
      DOCKER_GUARD_URL: http://docker-guard:2375
      IDEJO_FORUM_IMAGE: ${IDEJO_FORUM_IMAGE:-ghcr.io/callisto-rpg/idejo}
      IDEJO_FORUM_NETWORK: idejo-forums
      IDEJO_FORUM_DOMAIN: ${IDEJO_FORUM_DOMAIN}
      # ID-01: the identity provider's address, and the Hub's token for its API.
      IDEJO_ID_DOMAIN: ${IDEJO_ID_DOMAIN}
      ZITADEL_TOKEN_FILE: /zitadel-tokens/hub.pat
      IDEJO_DEFAULT_VERSION: ${IDEJO_DEFAULT_VERSION:-0.1.0}
      # OP-01: forum backups (cron, UTC) and how many are kept per forum.
      IDEJO_HUB_BACKUP_CRON: ${IDEJO_HUB_BACKUP_CRON:-0 2 * * *}
      IDEJO_HUB_BACKUPS_KEPT: ${IDEJO_HUB_BACKUPS_KEPT:-14}
      # OP-04: seconds an upgraded forum has to become healthy before it is rolled back.
      IDEJO_HUB_UPGRADE_HEALTH_SECONDS: ${IDEJO_HUB_UPGRADE_HEALTH_SECONDS:-300}
      # HN-07: optional SMTP shared by every forum.
      HUB_SMTP_HOST: ${HUB_SMTP_HOST:-}
      HUB_SMTP_PORT: ${HUB_SMTP_PORT:-}
      HUB_SMTP_SECURITY: ${HUB_SMTP_SECURITY:-}
      HUB_SMTP_USERNAME: ${HUB_SMTP_USERNAME:-}
      HUB_SMTP_PASSWORD: ${HUB_SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      docker-guard:
        condition: service_started
    volumes:
      # FL-04: markers of suspended forums, read by Caddy.
      - forum-state:/data/forum-state
      # FL-06: forum exports (standard Idejo backups). Back this volume up off the server.
      - exports:/data/exports
      # ID-01: the Hub's token for Zitadel's API (written by Zitadel's first start).
      - zitadel-tokens:/zitadel-tokens:ro
    networks: [default, docker, forums]
    expose:
      - "4000"
    # Healthy once the server accepts connections. The image has no curl or wget, so bash's
    # /dev/tcp checks the port.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Migrations run before the server starts.
      start_period: 60s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # The superuser is used only by the init script below, never by the Hub.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HUB_DB_PASSWORD: ${HUB_DB_PASSWORD}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, on an empty data directory.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [default, forums]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idejo_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      IDEJO_HUB_DOMAIN: ${IDEJO_HUB_DOMAIN}
      IDEJO_ID_DOMAIN: ${IDEJO_ID_DOMAIN}
      IDEJO_FORUM_DOMAIN: ${IDEJO_FORUM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # FL-04: suspended forums' markers (written by the Hub) and the static page.
      - forum-state:/srv/forum-state:ro
      - ./maintenance:/srv/maintenance:ro
      - caddy_data:/data       # certificates — keep this volume
      - caddy_config:/config
    depends_on:
      hub:
        condition: service_healthy
    networks: [default, forums]

  # ID-01: the identity provider (Zitadel, AGPL-3.0; steward decision 2026-11-03), at
  # IDEJO_ID_DOMAIN behind Caddy. Its own role and database on the shared PostgreSQL
  # (postgres-init/04-zitadel.sh). Its first start makes the instance (org "Idejo", an admin
  # whose password is in deploy/.env, a machine user for the Hub and one for the login
  # screen) and writes those two tokens into the zitadel-tokens volume. Everything runs as
  # nobody, so the login screen and the Hub can read them.
  # A new volume belongs to root: hand zitadel-tokens to nobody before Zitadel writes there.
  zitadel-tokens-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    command: ["chown", "65534:65534", "/tokens"]
    volumes:
      - zitadel-tokens:/tokens

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.20.1@sha256:4817dbd8896306867f28bba63e7dc3526b2d2646ac7111db9524eb3ab6e82301
    restart: unless-stopped
    user: "65534:65534"
    # start-from-init: its schemas on first start (its role and database exist already, made by
    # postgres-init/04-zitadel.sh, so its own role is enough as "admin": never the superuser).
    command: start-from-init --masterkeyFromEnv --tlsMode external
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY}
      ZITADEL_EXTERNALDOMAIN: ${IDEJO_ID_DOMAIN}
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_EXTERNALPORT: "443"
      # Caddy ends TLS; inside, plain HTTP/2 (also what `zitadel ready`, the health check, uses).
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Its first connection goes to its own database: pg_hba lets a role open only its own.
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: zitadel
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Idejo
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ACME_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: idejo-hub
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Idejo Hub
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /tokens/hub.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /tokens/login-client.pat
    volumes:
      - zitadel-tokens:/tokens
    depends_on:
      db:
        condition: service_healthy
      zitadel-tokens-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ID-01: Zitadel's sign-in pages (v4 runs them apart), under /ui/v2/login on IDEJO_ID_DOMAIN.
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.20.1@sha256:1508e83275f1471b20ed42b159174e6b3e10e6c2481e64c0aee7ed5bfeeec18b
    restart: unless-stopped
    user: "65534:65534"
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      CUSTOM_REQUEST_HEADERS: Host:${IDEJO_ID_DOMAIN}
      ZITADEL_SERVICE_USER_TOKEN_FILE: /tokens/login-client.pat
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
    volumes:
      - zitadel-tokens:/tokens:ro
    depends_on:
      zitadel:
        condition: service_healthy

  # HN-04: the only container with the Docker socket. MIT, pinned by digest. It allows only the
  # method/path pairs the Hub needs and refuses any bind mount; docker-guard (below) checks the
  # request bodies. No network: it answers on a Unix socket in a small tmpfs volume.
  socket-proxy:
    image: docker.io/wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: unless-stopped
    # nobody, in the group that owns the Docker socket on this host.
    user: "65534:${DOCKER_GID}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    command:
      - -proxysocketendpoint=/run/socket-proxy/proxy.sock
      - -proxysocketendpointfilemode=0600
      - -loglevel=info
      - -watchdoginterval=3600
      - -stoponwatchdog
      # No host directory may be bind-mounted (forums use named volumes only).
      - -allowbindmountfrom=/nonexistent/idejo-hub
      - -allowGET=/v1\.[0-9]+/(_ping|version|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs|archive)|exec/[a-f0-9]+/json|volumes/[a-zA-Z0-9_.-]+|images/.+/json)
      - -allowHEAD=/v1\.[0-9]+/(_ping|containers/[a-zA-Z0-9_.-]+/archive)
      - -allowPOST=/v1\.[0-9]+/(containers/create|containers/[a-zA-Z0-9_.-]+/(start|stop|restart|wait|exec)|exec/[a-f0-9]+/start|volumes/create|images/create)
      - -allowPUT=/v1\.[0-9]+/containers/[a-zA-Z0-9_.-]+/archive
      - -allowDELETE=/v1\.[0-9]+/(containers|volumes)/[a-zA-Z0-9_.-]+
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-proxy-socket:/run/socket-proxy

  # HN-04: checks every request body (no privileged container, no host namespace, only the
  # Idejo image, only forum containers and volumes) before it reaches socket-proxy. Built
  # from guard/ in this repository; runs as nobody, like the proxy's socket.
  docker-guard:
    build:
      context: ..
      dockerfile: guard/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    environment:
      RELEASE_TMP: /tmp
      DOCKER_GUARD_UPSTREAM_SOCKET: /run/socket-proxy/proxy.sock
      DOCKER_GUARD_IMAGE: ${IDEJO_FORUM_IMAGE:-ghcr.io/callisto-rpg/idejo}
      DOCKER_GUARD_NETWORK: idejo-forums
    volumes:
      - docker-proxy-socket:/run/socket-proxy
    depends_on:
      socket-proxy:
        condition: service_started
    expose:
      - "2375"
    networks: [docker]

networks:
  default:
  # The Hub and docker-guard only; no way out.
  docker:
    internal: true
  # Forum containers, created by the Hub, join this network by name (HN-04).
  forums:
    name: idejo-forums

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # FL-04: one empty file per suspended forum's host, written by the Hub, read by Caddy.
  forum-state:
  # FL-06: exports the Hub keeps, final ones (FL-05) included.
  exports:
  # ID-01: the tokens Zitadel's first start writes for the Hub and its login screen.
  zitadel-tokens:
  # The socket between socket-proxy and docker-guard, in memory, owned by nobody.
  docker-proxy-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64k,uid=65534,gid=65534,mode=0700
