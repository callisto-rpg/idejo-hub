#
# Hub milestone 3 exit check (deploy/test/m3/README.md): nightly and on demand. Needs an
# idejo image with AC-09's consent and the leave/delete-account commands (0.2.0).

name: M3 exit check

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      idejo_image:
        description: idejo image for the forums
        default: ghcr.io/callisto-rpg/idejo:0.2.0

permissions:
  contents: read

jobs:
  exit-check:
    name: Milestone 3 exit check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: deploy/test/m3/run.sh
        env:
          IDEJO_BASE_IMAGE: ${{ inputs.idejo_image || 'ghcr.io/callisto-rpg/idejo:0.2.0' }}
